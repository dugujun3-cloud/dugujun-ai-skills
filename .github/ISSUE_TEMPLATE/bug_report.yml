name: Bug report
description: Report an installation, script, routing, or output-contract problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, customer information, cookies, or internal links.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Exact Skill directory name
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Agent and version
      placeholder: Codex, Claude Code, or another Agent with version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or redacted input only
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
