name: Feature request
description: Propose a focused public Skill improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: problem
    attributes:
      label: User problem
      description: What repeatable decision or task needs improvement?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance
      description: Describe observable inputs, outputs, boundaries, and how success could be checked
    validations:
      required: true
  - type: textarea
    id: public_boundary
    attributes:
      label: Public-data and rights boundary
      description: Confirm the proposal does not require private data or unlicensed third-party material
    validations:
      required: true
